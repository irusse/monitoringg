; 3MESH Access firmware for Heltec WiFi LoRa 32 V4
; Phase 13: BLE '{' mux + Russian OLED; USB mux unchanged.
; Do not compile companion ui-new / DISPLAY_CLASS.

[platformio]
default_envs = heltec_v4_access
src_dir = .
boards_dir = ../../vendor/MeshCore/boards

[env:heltec_v4_access]
platform = platformio/espressif32@6.11.0
framework = arduino
board = heltec_v4
board_build.variant = esp32s3
upload_port = COM23
upload_speed = 460800
monitor_port = COM23
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/force_v4_software_aes.py
build_src_filter =
  +<src/>
  +<../../vendor/MeshCore/src/*.cpp>
  +<../../vendor/MeshCore/src/helpers/*.cpp>
  +<../../vendor/MeshCore/src/helpers/radiolib/*.cpp>
  +<../../vendor/MeshCore/src/helpers/sensors/EnvironmentSensorManager.cpp>
  +<../../vendor/MeshCore/src/helpers/esp32/SerialBLEInterface.cpp>
  +<../../vendor/MeshCore/variants/heltec_v4/*.cpp>
  +<../../vendor/MeshCore/examples/companion_radio/MyMesh.cpp>
  +<../../vendor/MeshCore/examples/companion_radio/DataStore.cpp>
  +<../../vendor/MeshCore/lib/ed25519/*.c>
build_flags =
  -w
  -DNDEBUG
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D ESP32_PLATFORM
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; MeshCore narrow: 868.731 MHz, SF 8, CR 8, BW 62.5 kHz.
  ; Saved /prefs.json on an already booted node overrides these until cleared.
  -D LORA_FREQ=868.731
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -I include
  -I src
  -I ../../vendor/MeshCore/src
  -I ../../vendor/MeshCore/variants/heltec_v4
  -I ../../vendor/MeshCore/examples/companion_radio
  -I ../../vendor/MeshCore/lib/ed25519
  ; --- MeshCore heltec_v4_oled / Heltec_lora32_v4 ---
  -D HELTEC_LORA_V4
  -D HELTEC_LORA_V4_OLED
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7
  -D P_LORA_GC1109_PA_EN=2
  -D P_LORA_GC1109_PA_TX_EN=46
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D LORA_TX_POWER=10
  -D MAX_LORA_TX_POWER=22
  -D SX126X_REGISTER_PATCH=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=38
  -D PIN_GPS_TX=39
  -D PIN_GPS_RESET=42
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D PIN_GPS_EN=34
  -D PIN_GPS_EN_ACTIVE=LOW
  -D ENV_INCLUDE_GPS=0
  -D PIN_ADC_CTRL=37
  -D PIN_VBAT_READ=1
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
  ; --- Companion BLE + USB (MultiSerialInterface) ---
  -D BLE_PIN_CODE=123456
  -D ENABLE_USB_INTERFACE
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  -D BLE_NAME_PREFIX='"3MESH-"'
  -D ADVERT_NAME='"TS-001"'
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D MESH485_DEBUG=1
  -D MESH485_RDM6300=1
  ; Do NOT define DISPLAY_CLASS — Access OLED owns the panel.
; Panel node is the default: EXT-001, Wiegand on GPIO 15/16, UART1 is RS-485.
; Monitor node: -D MESH485_NODE_ID=\"EXT-002\" -D MESH485_RDM6300=1
; That flag reads RDM6300 on GPIO 38 and holds DE in RX. It does not add a DISCOVER id.
lib_ldf_mode = deep+
lib_deps =
  SPI
  Wire
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  stevemarple/MicroNMEA @ ^2.0.6
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  https://github.com/pvtex/Wiegand-NG-Multi-Bit-Wiegand-Library-for-Arduino

; Heltec WiFi LoRa 32 V3 monitor. CP2102 UART is COM, not USB-CDC.
; Same radio defaults as the V4 image. No RDM6300, no Wiegand (pins differ).
; OLED 17/18/21, Vext 36 active LOW, SX1262 pins from MeshCore heltec_v3.
[env:heltec_v3_access]
extends = env:heltec_v4_access
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
; Radio init on the 8 MB image overflows the default IPC task stack.
board_build.sdkconfig_options =
  CONFIG_ESP_IPC_TASK_STACK_SIZE=3072
upload_port = COM10
upload_speed = 460800
monitor_port = COM10
monitor_speed = 115200
build_src_filter =
  +<src/>
  +<../../vendor/MeshCore/src/*.cpp>
  +<../../vendor/MeshCore/src/helpers/*.cpp>
  +<../../vendor/MeshCore/src/helpers/radiolib/*.cpp>
  +<../../vendor/MeshCore/src/helpers/sensors/EnvironmentSensorManager.cpp>
  +<../../vendor/MeshCore/src/helpers/esp32/SerialBLEInterface.cpp>
  +<../../vendor/MeshCore/variants/heltec_v3/*.cpp>
  +<../../vendor/MeshCore/examples/companion_radio/MyMesh.cpp>
  +<../../vendor/MeshCore/examples/companion_radio/DataStore.cpp>
  +<../../vendor/MeshCore/lib/ed25519/*.c>
build_flags =
  -w
  -DNDEBUG
  -D ESP32_PLATFORM
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D LORA_FREQ=868.731
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -I include
  -I src
  -I ../../vendor/MeshCore/src
  -I ../../vendor/MeshCore/variants/heltec_v3
  -I ../../vendor/MeshCore/examples/companion_radio
  -I ../../vendor/MeshCore/lib/ed25519
  -D HELTEC_LORA_V3
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D USE_SX1262
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
  -D ENV_INCLUDE_GPS=0
  -D BLE_PIN_CODE=123456
  -D ENABLE_USB_INTERFACE
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  -D BLE_NAME_PREFIX='"3MESH-"'
  -D ADVERT_NAME='"EXT-002"'
  -D MESH485_NODE_ID=\"EXT-002\"
  -D MESH485_ROLE_SOURCE=0
  -D MESH485_DEBUG=1
  -D MESH485_RDM6300=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256

; Second V3, alarm source EXT-003 (COM44). Same pins 47 and 45.
; Role can still be changed from the OLED menu.
[env:heltec_v3_source]
extends = env:heltec_v3_access
board_build.sdkconfig_options =
  CONFIG_ESP_IPC_TASK_STACK_SIZE=3072
build_flags =
  ${env:heltec_v3_access.build_flags}
  -D MESH485_NODE_ID=\"EXT-003\"
  -D ADVERT_NAME='"EXT-003"'
  -D MESH485_ROLE_SOURCE=1

; Heltec WiFi LoRa 32 V4 with ST7789 instead of the SSD1306.
; TFT uses GPIO 15/16/17/18/21/33, so the red lamp stays off on this image.
[env:heltec_v4_tft]
extends = env:heltec_v4_access
build_flags =
  ${env:heltec_v4_access.build_flags}
  -D HELTEC_LORA_V4_TFT
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=3
  -D PIN_TFT_RST=18
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=16
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=33
  -D MESH485_NODE_ID=\"EXT-004\"
  -D ADVERT_NAME='"EXT-004"'
  -D MESH485_ROLE_SOURCE=0
lib_deps =
  ${env:heltec_v4_access.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:heltec_v4_access_stub]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
build_src_filter =
  +<src/>
  -<src/mesh485/ble_mux.cpp>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D ACCESS_STUB_NO_RADIO=1
  -D ACCESS_DISPLAY_SERIAL_ONLY=1
  -I include
monitor_speed = 115200
lib_deps =
  https://github.com/pvtex/Wiegand-NG-Multi-Bit-Wiegand-Library-for-Arduino

[env:native_protocol_tests]
platform = native
extra_scripts =
  pre:extra_native_msvc.py
  extra_native_msvc.py
build_src_filter =
  +<src/mesh_access/>
  +<src/mesh485/>
  -<src/mesh485/usb_mux.cpp>
  -<src/mesh485/ble_mux.cpp>
  +<src/device/>
  +<src/protocols/>
  +<src/storage/>
  +<src/access/>
  +<test/native/>
build_flags =
  -D UNIT_TEST=1
  -D MESH485_NATIVE=1
  -I include
  -I src
